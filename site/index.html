<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2d"><title>STUDY — Learn with direction</title>
<style>
:root{--ink:#142238;--muted:#718096;--line:#e8edf3;--bg:#f5f7fb;--blue:#4263eb;--mint:#dff7ee;--shadow:0 12px 35px #172b4d0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}.side{width:250px;background:#101b2d;color:#fff;padding:26px 18px;display:flex;flex-direction:column;flex-shrink:0}.brand{font-size:21px;font-weight:850;letter-spacing:2px;padding:0 12px 30px}.brand small{display:block;font-size:9px;color:#9eabc0;letter-spacing:2px;margin-top:5px}.navlabel{font-size:10px;color:#8493aa;letter-spacing:1.5px;padding:16px 12px 9px}.nav button{width:100%;border:0;background:transparent;color:#aab6c8;padding:12px;border-radius:10px;text-align:left;margin:2px 0}.nav button.active,.nav button:hover{background:#24334a;color:#fff}.sidefoot{margin-top:auto;background:#1b2a40;padding:16px;border-radius:14px;color:#b8c5d8;font-size:12px;line-height:1.5}.sidefoot b{color:white}.main{flex:1;min-width:0}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.top .crumb{font-size:13px;color:var(--muted)}.user{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700}.avatar{width:36px;height:36px;border-radius:12px;background:#e8edff;color:var(--blue);display:grid;place-items:center;font-weight:800}.content{max-width:1250px;margin:auto;padding:34px}.eyebrow{color:var(--blue);font-size:10px;letter-spacing:1.8px;font-weight:800}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:25px}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}h2{font-size:18px;margin:0 0 14px}p{color:var(--muted);line-height:1.55;margin:7px 0}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:13px}.primary{background:var(--blue);color:white}.outline{background:white;border:1px solid var(--line);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow)}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin:9px 0 3px}.stat small{color:#15956d;font-size:11px}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:17px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.listrow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}.bubble{width:40px;height:40px;border-radius:12px;background:#edf1ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.grow{flex:1;min-width:0}.grow b{display:block;font-size:13px}.grow small{color:var(--muted);font-size:11px}.pill{font-size:10px;border-radius:30px;background:#e7f8f0;color:#16845f;padding:6px 9px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card h3{margin:14px 0 6px;font-size:17px}.meta{display:flex;gap:13px;color:var(--muted);font-size:11px;margin:16px 0}.card .btn{width:100%}.toolbar{display:flex;gap:10px;margin:18px 0}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:white;min-width:0}.toolbar input{flex:1}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#101b2d88;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:#fff;border-radius:18px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%}.question{padding:17px;border:1px solid var(--line);border-radius:14px;margin:13px 0}.option{display:block;padding:10px;border:1px solid var(--line);border-radius:9px;margin:8px 0;cursor:pointer}.option:has(input:checked){border-color:var(--blue);background:#f2f5ff}.bar{height:8px;background:#edf0f5;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.empty{padding:35px;text-align:center;color:var(--muted)}.rolehint{font-size:11px;color:#8c9ab0;margin-top:12px}
@media(max-width:900px){.side{width:205px}.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:650px){.layout{display:block}.side{width:auto;padding:14px;display:block}.brand{padding:4px 8px 12px}.brand small,.navlabel,.sidefoot{display:none}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;width:auto;padding:9px 11px;font-size:12px}.top{height:60px;padding:0 16px}.content{padding:22px 15px}.heading{align-items:flex-start;flex-direction:column}h1{font-size:26px}.cards{grid-template-columns:1fr}.grid{gap:9px}.stat{padding:14px}.stat strong{font-size:23px}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style></head>
<body><div class="layout"><aside class="side"><div class="brand">STUDY<small>LEARN WITH DIRECTION</small></div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav"></nav><div class="sidefoot"><b>Make every session count.</b><br>Small steps. Measurable progress.<div class="rolehint">Demo workspace · data saved in this browser</div></div></aside><main class="main"><header class="top"><span class="crumb">Workspace / <b id="crumb">Overview</b></span><div class="user"><div class="avatar" id="avatar">AM</div><span id="username">Alex Morgan</span></div></header><div class="content" id="app"></div></main></div><div id="modal" class="hidden"></div>
<script>
const $=s=>document.querySelector(s), get=(k,d)=>{try{return JSON.parse(localStorage.getItem('study-'+k))??d}catch{return d}}, put=(k,v)=>localStorage.setItem('study-'+k,JSON.stringify(v));
const requested=new URLSearchParams(location.search).get('role');let role=requested==='teacher'?'teacher':'student';let user=get('user',{student:'Alex Morgan',teacher:'Jordan Lee'});let page='overview',exam=null,answers=[],qIndex=0,tick=null;
let exams=get('exams',[
{id:1,title:'Real Numbers & Polynomials',subject:'Mathematics',duration:15,marks:20,published:true,questions:[['The HCF of 96 and 404 is?',['2','4','8','12'],1],['13/125 in decimal form is?',['0.014','0.104','1.04','0.13'],1],['Other zero of x² − 5x + 6 if one zero is 2?',['1','2','3','6'],2]]},
{id:2,title:'Chemical Reactions',subject:'Science',duration:12,marks:15,published:true,questions:[['A reaction that releases heat is:', ['Endothermic','Exothermic','Photolytic','Displacement'],1],['Rusting of iron is:', ['Corrosion','Neutralisation','Decomposition','Precipitation'],0]]},
{id:3,title:'Power Sharing',subject:'Social Science',duration:10,marks:10,published:true,questions:[['Which is a classic example of power sharing?',['Belgium','Sri Lanka','Myanmar','Nepal'],0],['Horizontal distribution of power is among:', ['Different levels','Different organs','Countries','Parties only'],1]]}
]);
let results=get('results',[{title:'Real Numbers & Polynomials',score:80,date:'Nov 15',subject:'Mathematics'},{title:'Chemical Reactions',score:60,date:'Nov 13',subject:'Science'}]);
let resources=get('resources',['Mathematics — Chapter-wise practice','Science — Important diagrams','Social Science — Map work']);
function save(){put('exams',exams);put('results',results);put('resources',resources);put('user',user)}
function setRole(r){role=r;history.replaceState({},'',location.pathname+'?role='+r);render()}
const nav=[['overview','⌂','Overview'],['exams','▤','Assessments'],['library','▧','Study library'],['progress','◷','My progress'],['students','♙','Students'],['settings','⚙','Settings']];
function render(){if(exam){renderExam();return}$('#username').textContent=user[role];$('#avatar').textContent=role==='teacher'?'JL':'AM';$('#crumb').textContent=nav.find(n=>n[0]===page)?.[2]||'Overview';$('#nav').innerHTML=nav.filter(n=>n[0]!=='students'||role==='teacher').map(n=>'<button class="'+(page===n[0]?'active':'')+'" data-page="'+n[0]+'">'+n[1]+'　'+n[2]+'</button>').join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});let published=exams.filter(e=>e.published);let avg=results.length?Math.round(results.reduce((a,r)=>a+r.score,0)/results.length):0;
if(page==='overview')$('#app').innerHTML='<div class="heading"><div><div class="eyebrow">YOUR LEARNING SPACE</div><h1>Good '+(role==='teacher'?'morning, Jordan':'morning, Alex')+'.</h1><p>'+ (role==='teacher'?'Manage assessments and keep track of your learners.':'Ready to make today count? Pick up where you left off.')+'</p></div>'+(role==='teacher'?'<button class="btn primary" id="new">＋ Create assessment</button>':'<button class="btn primary" id="browse">Explore assessments →</button>')+'</div><div class="grid"><div class="stat"><span>'+ (role==='teacher'?'Published assessments':'Available assessments')+'</span><strong>'+published.length+'</strong><small>↑ Ready to use</small></div><div class="stat"><span>'+(role==='teacher'?'Learner attempts':'Completed assessments')+'</span><strong>'+results.length+'</strong><small>Across your workspace</small></div><div class="stat"><span>'+(role==='teacher'?'Class average':'Your average score')+'</span><strong>'+avg+'%</strong><small>↑ Keep improving</small></div><div class="stat"><span>Study resources</span><strong>'+resources.length+'</strong><small>In your library</small></div></div><div class="cols"><section class="panel"><div class="panelhead"><h2>'+(role==='teacher'?'Recent assessments':'Continue learning')+'</h2><button class="btn outline" id="all">View all</button></div>'+published.slice(0,3).map(e=>'<div class="listrow"><div class="bubble">▤</div><div class="grow"><b>'+e.title+'</b><small>'+e.subject+' · '+e.duration+' min · '+e.marks+' marks</small></div><span class="pill">Published</span></div>').join('')+'</section><section class="panel"><h2>Recent activity</h2>'+results.slice(0,4).map(r=>'<div class="listrow"><div class="bubble">✓</div><div class="grow"><b>'+r.title+'</b><small>'+r.subject+' · '+r.date+'</small></div><b>'+r.score+'%</b></div>').join('')+'</section></div>';
if(page==='exams')$('#app').innerHTML='<div class="heading"><div><div class="eyebrow">PRACTICE MAKES PROGRESS</div><h1>'+(role==='teacher'?'Assessments':'Explore assessments')+'</h1><p>'+(role==='teacher'?'Create and publish student assessments.':'Choose a subject and challenge yourself.')+'</p></div>'+(role==='teacher'?'<button class="btn primary" id="new">＋ New assessment</button>':'')+'</div><div class="toolbar"><input id="search" placeholder="Search assessments…"><select id="subject"><option>All subjects</option>'+[...new Set(exams.map(e=>e.subject))].map(s=>'<option>'+s+'</option>').join('')+'</select></div><div class="cards" id="examcards"></div>';
if(page==='library')$('#app').innerHTML='<div class="heading"><div><div class="eyebrow">YOUR KNOWLEDGE HUB</div><h1>Study library</h1><p>Notes, worksheets and question papers in one place.</p></div>'+(role==='teacher'?'<label class="btn primary">＋ Add resource<input id="upload" type="file" hidden multiple></label>':'')+'</div><div class="panel"><h2>Learning resources</h2>'+resources.map((r,i)=>'<div class="listrow"><div class="bubble">PDF</div><div class="grow"><b>'+r+'</b><small>Study material · '+(i+1)+' resource</small></div><span class="pill">Available</span></div>').join('')+'</div>';
if(page==='progress')$('#app').innerHTML='<div class="heading"><div><div class="eyebrow">YOUR GROWTH, MADE VISIBLE</div><h1>My progress</h1><p>Every attempt is a step towards mastery.</p></div></div><div class="grid"><div class="stat"><span>Average score</span><strong>'+avg+'%</strong></div><div class="stat"><span>Completed</span><strong>'+results.length+'</strong></div><div class="stat"><span>Subjects</span><strong>'+new Set(results.map(r=>r.subject)).size+'</strong></div><div class="stat"><span>Resources</span><strong>'+resources.length+'</strong></div></div><section class="panel"><h2>Assessment history</h2>'+results.map(r=>'<div class="listrow"><div class="bubble">✓</div><div class="grow"><b>'+r.title+'</b><small>'+r.subject+' · '+r.date+'</small></div><b>'+r.score+'%</b></div>').join('')+'</section>';
if(page==='students')$('#app').innerHTML='<div class="heading"><div><div class="eyebrow">TEACHER WORKSPACE</div><h1>Student insights</h1><p>Sample learner activity in this demo workspace.</p></div></div><section class="panel"><h2>Class overview</h2>'+['Alex Morgan','Jamie Smith','Riya Kapoor'].map((n,i)=>'<div class="listrow"><div class="avatar">'+n.split(' ').map(x=>x[0]).join('')+'</div><div class="grow"><b>'+n+'</b><small>Practice activity · Class 10</small></div><span class="pill">'+[84,76,91][i]+'% average</span></div>').join('')+'</section>';
if(page==='settings')$('#app').innerHTML='<div class="heading"><div><div class="eyebrow">PREFERENCES & ACCOUNT</div><h1>Settings</h1><p>Manage your demo profile and workspace.</p></div></div><section class="panel" style="max-width:620px"><div class="field"><label>Display name</label><input id="name" value="'+user[role]+'"></div><div class="field"><label>Workspace role</label><select id="role"><option value="student" '+(role==='student'?'selected':'')+'>Student</option><option value="teacher" '+(role==='teacher'?'selected':'')+'>Teacher</option></select></div><p>Demo mode stores your sample data in this browser. Real teacher access requires secure authentication and administrator approval.</p><button class="btn primary" id="save">Save profile</button></section>';
if(page==='exams'){const fill=()=>{$('#examcards').innerHTML=exams.filter(e=>(role==='teacher'||e.published)&&e.title.toLowerCase().includes($('#search').value.toLowerCase())&&($('#subject').value==='All subjects'||e.subject===$('#subject').value)).map(e=>'<article class="card"><div class="eyebrow">'+e.subject.toUpperCase()+'</div><h3>'+e.title+'</h3><p>Practice assessment designed to check your understanding.</p><div class="meta"><span>◷ '+e.duration+' min</span><span>▤ '+e.questions.length+' questions</span><span>★ '+e.marks+' marks</span></div><button class="btn outline" data-start="'+e.id+'">'+(role==='teacher'?'Preview assessment':'Start assessment')+' →</button></article>').join('')||'<div class="empty">No assessments found.</div>';$('#examcards').querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startExam(+b.dataset.start))};fill();$('#search').oninput=fill;$('#subject').onchange=fill}
$('#app').querySelectorAll('#new').forEach(b=>b.onclick=createModal);$('#browse')?.addEventListener('click',()=>{page='exams';render()});$('#all')?.addEventListener('click',()=>{page='exams';render()});$('#upload')?.addEventListener('change',e=>{[...e.target.files].forEach(f=>resources.unshift(f.name));save();render()});$('#save')?.addEventListener('click',()=>{user[role]=$('#name').value||user[role];setRole($('#role').value);save()})}
function createModal(){$('#modal').className='overlay';$('#modal').innerHTML='<div class="modal"><div class="panelhead"><h2>Create assessment</h2><button class="btn outline" id="close">✕</button></div><div class="field"><label>Assessment title</label><input id="title" placeholder="e.g. Quadratic Equations"></div><div class="field"><label>Subject</label><input id="subj" placeholder="Mathematics"></div><div class="field"><label>Duration (minutes)</label><input id="duration" type="number" value="15" min="1"></div><div class="field"><label>Question</label><textarea id="prompt" placeholder="Enter your first question"></textarea></div><div class="field"><label>Options (separate with commas)</label><input id="opts" placeholder="Option A, Option B, Option C, Option D"></div><div class="field"><label>Correct option number (1–4)</label><input id="answer" type="number" min="1" max="4" value="1"></div><button class="btn primary" id="publish">Publish assessment</button></div>';$('#close').onclick=()=>$('#modal').className='hidden';$('#publish').onclick=()=>{let opts=$('#opts').value.split(',').map(x=>x.trim()).filter(Boolean);if(!$('#title').value||!$('#prompt').value||opts.length<2){alert('Add a title, question and at least two options.');return}exams.unshift({id:Date.now(),title:$('#title').value,subject:$('#subj').value||'General',duration:+$('#duration').value||15,marks:opts.length*5,published:true,questions:[[$('#prompt').value,opts,Math.max(0,Math.min(opts.length-1,(+$('#answer').value||1)-1))]]});save();$('#modal').className='hidden';page='exams';render()}}
function startExam(id){exam=exams.find(e=>e.id===id);answers=Array(exam.questions.length).fill(-1);qIndex=0;let seconds=exam.duration*60;renderExam();tick=setInterval(()=>{seconds--;let t=$('#timer');if(t)t.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(seconds<=0)finish()},1000);window.examTimer=()=>seconds}
function renderExam(){let q=exam.questions[qIndex];$('#crumb').textContent='Assessment';$('#app').innerHTML='<div class="heading"><div><div class="eyebrow">'+exam.subject.toUpperCase()+'</div><h1>'+exam.title+'</h1><p>Question '+(qIndex+1)+' of '+exam.questions.length+'</p></div><div class="pill" id="timer">'+exam.duration+':00</div></div><div class="bar"><i style="width:'+((qIndex+1)/exam.questions.length*100)+'%"></i></div><section class="panel" style="margin-top:20px"><div class="eyebrow">QUESTION '+(qIndex+1)+'</div><h2 style="margin-top:12px">'+q[0]+'</h2>'+q[1].map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'" '+(answers[qIndex]===i?'checked':'')+'>　'+o+'</label>').join('')+'<div class="panelhead" style="margin-top:22px"><button class="btn outline" id="prev" '+(qIndex===0?'disabled':'')+'>← Previous</button><button class="btn primary" id="next">'+(qIndex===exam.questions.length-1?'Submit assessment':'Next question →')+'</button></div></section>';$('#app').querySelectorAll('[name=answer]').forEach(x=>x.onchange=()=>answers[qIndex]=+x.value);$('#prev').onclick=()=>{qIndex--;renderExam()};$('#next').onclick=()=>{if(qIndex===exam.questions.length-1)finish();else{qIndex++;renderExam()}}}
function finish(){if(tick)clearInterval(tick);let correct=exam.questions.reduce((n,q,i)=>n+(answers[i]===q[2]?1:0),0);results.unshift({title:exam.title,score:Math.round(correct/exam.questions.length*100),date:new Date().toLocaleDateString(),subject:exam.subject});save();alert('Assessment submitted. Your score: '+correct+'/'+exam.questions.length);exam=null;page='progress';render()}
render();
</script></body></html>
